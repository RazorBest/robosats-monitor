[project]
name = "onion-monitor"
version = "0.1.0"
description = "Monitors a Tor .onion address and logs uptime"
requires-python = ">=3.11"
dependencies = [
    "requests[socks]>=2.34.2",
    "websocket-client[optional]>=1.9.0",
    "pandas>=3.0.5",
    "boto3>=1.43.78",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "black==26.5",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pytest==9.1",
]

[tool.black]
line-length = 140
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unreachable = true
pretty = true
exclude = '^\.venv/'

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"] # isort, pyupgrade, bugbear
