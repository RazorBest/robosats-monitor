<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIP-69 Orderbook Dashboard</title>
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Light mode (default) */
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --toggle-bg: #cbd5e1;
        }

        /* Dark mode overrides */
        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --input-border: #475569;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --toggle-bg: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        select {
            background-color: var(--input-bg);
            color: var(--text-color);
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Toggle Switch Styling */
        .theme-switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.2rem; /* Align with dropdown controls */
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            transition: 0.3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 850px;
            box-shadow: var(--card-shadow);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>
    <h2>P2P Orderbook Analytics</h2>

    <div class="controls">
        <label>Group By:
            <select id="groupBy" onchange="fetchAndDraw()">
                <option value="payment_methods">Payment Method</option>
                <option value="platform" selected>Platform</option>
                <option value="currency">Currency</option>
                <option value="type">Order Type</option>
            </select>
        </label>
        
        <label>Metric:
            <select id="metric" onchange="fetchAndDraw()">
                <option value="premium" selected>Premium (%)</option>
                <option value="bond">Bond (%)</option>
            </select>
        </label>

        <label>Order Type:
            <select id="orderType" onchange="fetchAndDraw()">
                <option value="buy">Buy</option>
                <option value="sell" selected>Sell</option>
            </select>
        </label>

        <label>Currency:
            <select id="currency" onchange="fetchAndDraw()">
                <option value="AED" selected>AED</option>
                <option value="ARS" selected>ARS</option>
                <option value="AUD" selected>AUD</option>
                <option value="BRL" selected>BRL</option>
                <option value="BTC" selected>BTC</option>
                <option value="CAD" selected>CAD</option>
                <option value="CHF" selected>CHF</option>
                <option value="CLP" selected>CLP</option>
                <option value="COP" selected>COP</option>
                <option value="CRC" selected>CRC</option>
                <option value="CZK" selected>CZK</option>
                <option value="DKK" selected>DKK</option>
                <option value="DOC" selected>DOC</option>
                <option value="EUR" selected>EUR</option>
                <option value="GBP" selected>GBP</option>
                <option value="HUF" selected>HUF</option>
                <option value="ILS" selected>ILS</option>
                <option value="INR" selected>INR</option>
                <option value="ISK" selected>ISK</option>
                <option value="JPY" selected>JPY</option>
                <option value="KES" selected>KES</option>
                <option value="KZT" selected>KZT</option>
                <option value="MXN" selected>MXN</option>
                <option value="MYR" selected>MYR</option>
                <option value="NOK" selected>NOK</option>
                <option value="NZD" selected>NZD</option>
                <option value="PHP" selected>PHP</option>
                <option value="PLN" selected>PLN</option>
                <option value="PYG" selected>PYG</option>
                <option value="RON" selected>RON</option>
                <option value="SAR" selected>SAR</option>
                <option value="SEK" selected>SEK</option>
                <option value="SGD" selected>SGD</option>
                <option value="TRY" selected>TRY</option>
                <option value="UAH" selected>UAH</option>
                <option value="USD" selected>USD</option>
                <option value="USDC" selected>USDC</option>
                <option value="USDT" selected>USDT</option>
                <option value="UYU" selected>UYU</option>
                <option value="ZAR" selected>ZAR</option>
            </select>
        </label>

        <label>Aggregation:
            <select id="aggType" onchange="fetchAndDraw()">
                <option value="count">Count</option>
                <option value="mean" selected>Mean</option>
                <option value="median">Median</option>
            </select>
        </label>

        <!-- Toggle Switch -->
        <div class="theme-switch-container">
            <span>☀️</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
            <span>🌙</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script>

        UPDATE THIS
        // TODO: Replace <your-username> with the actual subdomain Cloudflare gave you
        const fileUrl = `https://nip69-api.<your-username>.workers.dev/analyzed/rolling_premium_${groupBy}_${currency}_${orderType}.json`;



        let chartInstance = null;

        function toggleTheme() {
            const isDark = document.getElementById('themeToggle').checked;
            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            fetchAndDraw();
        }

        async function fetchAndDraw() {
            const groupBy = document.getElementById('groupBy').value;
            const metric = document.getElementById('metric').value;
            const currency = document.getElementById('currency').value;
            const orderType = document.getElementById("orderType").value;
            const aggType = document.getElementById('aggType').value; 
            const isDark = document.body.classList.contains('dark-mode');
            
            const fileUrl = `analyzed/rolling_premium_${groupBy}_${currency}_${orderType}.json`;

            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error("Data file not found");
                const data = await response.json();

                // 1. Extract unique timestamps and format them for the X-axis
                const timestamps = [...new Set(data.map(row => row.created_at))].sort();
                
                const labels = timestamps.map(ts => {
                    const date = new Date(ts);
                    return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + 
                           ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                });

                // 2. Group data points by category so each gets its own line
                const groupedData = {};
                data.forEach(row => {
                    const category = row[groupBy] || 'Total';
                    if (!groupedData[category]) groupedData[category] = {};
                    groupedData[category][row.created_at] = row[aggType];
                });

                // 3. Generate color palette and build Chart.js datasets
                const palette = isDark 
                    ? ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#f472b6']
                    : ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#db2777'];

                const datasets = Object.keys(groupedData).map((category, idx) => {
                    const color = palette[idx % palette.length];
                    return {
                        label: category,
                        data: timestamps.map(ts => groupedData[category][ts] ?? null),
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.3, // Smooths out rolling line curves
                        fill: false,
                        spanGaps: true,
                        pointRadius: 2
                    };
                });

                const ctx = document.getElementById('myChart').getContext('2d');
                
                if (chartInstance) {
                    chartInstance.destroy();
                }

                const formattedAgg = aggType.charAt(0).toUpperCase() + aggType.slice(1);
                const formattedMetric = metric.charAt(0).toUpperCase() + metric.slice(1);
                
                // Dynamically set Y-axis title based on metric vs count
                const yAxisLabel = aggType === 'count' ? 'Order Count' : `${formattedAgg} ${formattedMetric} (%)`;

                const textColor = isDark ? '#cbd5e1' : '#334155';
                const gridColor = isDark ? '#334155' : '#e2e8f0';

                chartInstance = new Chart(ctx, {
                    type: 'line', // Line chart for time-series rolling trends
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        interaction: {
                            mode: 'index',
                            intersect: false, // Hovering shows tooltip values for all lines at that timestamp
                        },
                        plugins: {
                            legend: {
                                labels: { color: textColor }
                            },
                            title: {
                                display: true,
                                text: `${formattedAgg} ${formattedMetric} Over Time`,
                                color: textColor
                            }
                        },
                        scales: {
                            x: {
                                ticks: { 
                                    color: textColor,
                                    maxTicksLimit: 10 // Keeps time labels clean and legible
                                },
                                grid: { color: gridColor }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: yAxisLabel,
                                    color: textColor
                                },
                                ticks: { color: textColor },
                                grid: { color: gridColor }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        // Initial render on page load
        fetchAndDraw();
    </script>
</body>
</html>
