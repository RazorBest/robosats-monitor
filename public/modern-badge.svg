<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="modGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="modGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#modGlow)">
    <!-- Minimalist Glass Card Container -->
    <rect x="4" y="4" width="32" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Modern Isometric Terminal Grid Icon -->
    <rect x="9" y="9" width="22" height="16" rx="3" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    
    <!-- Pulse Line / Modern Wave -->
    <path d="M 12 17 L 16 17 L 18 13 L 22 21 L 24 17 L 28 17" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base stand -->
    <line x1="17" y1="28" x2="23" y2="28" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="25" x2="20" y2="28" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
</svg>
