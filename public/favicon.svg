<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee00"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Dark Background Disk for Tab Contrast -->
  <rect width="32" height="32" rx="7" fill="#090d16"/>
  
  <!-- Robot Antenna -->
  <line x1="16" y1="3" x2="16" y2="7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="3" r="1.75" fill="#ffee00"/>
  
  <!-- Robot Head Casing -->
  <rect x="5" y="7" width="22" height="20" rx="4.5" fill="url(#robotGrad)" stroke="#38bdf8" stroke-width="1.2"/>
  
  <!-- Robot Visor Screen -->
  <rect x="8" y="10.5" width="16" height="13" rx="2.5" fill="#060913"/>
  
  <!-- Lightning Bolt Eye Symbol inside Visor -->
  <polygon points="17,11.5 12,18 15.5,18 14.5,22.5 19.5,16 16,16" fill="url(#boltGrad)"/>
</svg>
